name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Tests
        run: dotnet test --configuration Release

      - name: Publish StudioCRM Desktop (Win-x64)
        run: |
          dotnet publish StudioCRM.Desktop/StudioCRM.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./dist

      - name: Create Zip Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./package -Force
          Copy-Item ./dist/StudioCRM.Desktop.exe ./package/
          Copy-Item ./dist/*.dll ./package/
          Compress-Archive -Path ./package/* -DestinationPath StudioCRM-Windows-x64.zip -CompressionLevel Optimal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: StudioCRM-Windows-x64.zip
          generate_release_notes: true
